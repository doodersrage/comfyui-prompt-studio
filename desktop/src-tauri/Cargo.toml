[package]
name = "prompt-studio"
version = "0.3.2"
description = "Prompt Studio desktop shell"
authors = ["Prompt Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "prompt_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
